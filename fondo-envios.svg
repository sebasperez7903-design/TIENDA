<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="65%" cy="45%" r="85%">
      <stop offset="0" stop-color="#14465A"/>
      <stop offset="0.6" stop-color="#0B2A3A"/>
      <stop offset="1" stop-color="#071A25"/>
    </radialGradient>
    <linearGradient id="calma" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#071A25" stop-opacity="0.75"/>
      <stop offset="0.55" stop-color="#071A25" stop-opacity="0"/>
    </linearGradient>
    <pattern id="puntos" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#F2EFE6" fill-opacity="0.12"/>
    </pattern>

    <path id="r1" d="M120,820 C420,560 700,900 960,600 S1500,300 1800,260"/>
    <path id="r2" d="M200,240 C500,120 760,420 1000,380 S1450,700 1760,860"/>
    <path id="r3" d="M100,520 C400,480 600,300 960,540 S1300,980 1700,560"/>

    <g id="paquete">
      <polygon points="0,-18 16,-9 0,0 -16,-9" fill="#E3C28F"/>
      <polygon points="-16,-9 0,0 0,18 -16,9" fill="#B98D52"/>
      <polygon points="16,-9 0,0 0,18 16,9" fill="#9C7440"/>
      <polygon points="-3,-16.5 3,-13.5 -13,-4.5 -19,-7.5" fill="#F2EFE6" fill-opacity="0.85" transform="translate(11,-1.5) scale(0.55)"/>
      <line x1="0" y1="0" x2="0" y2="18" stroke="#F2EFE6" stroke-opacity="0.5" stroke-width="1.5"/>
    </g>

    <g id="hub">
      <circle r="7" fill="#F2EFE6"/>
      <circle r="7" fill="none" stroke="#5FD0C5" stroke-width="2">
        <animate attributeName="r" values="7;34" dur="3.6s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.9;0" dur="3.6s" repeatCount="indefinite"/>
      </circle>
    </g>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#puntos)"/>

  <!-- rutas -->
  <g fill="none" stroke="#5FD0C5" stroke-linecap="round">
    <use href="#r1" xlink:href="#r1" stroke-opacity="0.18" stroke-width="10"/>
    <use href="#r1" xlink:href="#r1" stroke-opacity="0.8" stroke-width="2" stroke-dasharray="2 14"/>
    <use href="#r2" xlink:href="#r2" stroke-opacity="0.18" stroke-width="10"/>
    <use href="#r2" xlink:href="#r2" stroke-opacity="0.8" stroke-width="2" stroke-dasharray="2 14"/>
    <use href="#r3" xlink:href="#r3" stroke-opacity="0.18" stroke-width="10"/>
    <use href="#r3" xlink:href="#r3" stroke-opacity="0.8" stroke-width="2" stroke-dasharray="2 14"/>
  </g>

  <!-- centros de distribución -->
  <use href="#hub" xlink:href="#hub" x="120" y="820"/>
  <use href="#hub" xlink:href="#hub" x="960" y="600"/>
  <use href="#hub" xlink:href="#hub" x="1800" y="260"/>
  <use href="#hub" xlink:href="#hub" x="200" y="240"/>
  <use href="#hub" xlink:href="#hub" x="1000" y="380"/>
  <use href="#hub" xlink:href="#hub" x="1760" y="860"/>
  <use href="#hub" xlink:href="#hub" x="1700" y="560"/>

  <!-- paquetes en tránsito -->
  <g>
    <use href="#paquete" xlink:href="#paquete"><animateMotion dur="14s" repeatCount="indefinite" rotate="0"><mpath href="#r1" xlink:href="#r1"/></animateMotion></use>
    <use href="#paquete" xlink:href="#paquete"><animateMotion dur="14s" begin="-7s" repeatCount="indefinite" rotate="0"><mpath href="#r1" xlink:href="#r1"/></animateMotion></use>
    <use href="#paquete" xlink:href="#paquete"><animateMotion dur="17s" begin="-3s" repeatCount="indefinite" rotate="0"><mpath href="#r2" xlink:href="#r2"/></animateMotion></use>
    <use href="#paquete" xlink:href="#paquete"><animateMotion dur="17s" begin="-11s" repeatCount="indefinite" rotate="0"><mpath href="#r2" xlink:href="#r2"/></animateMotion></use>
    <use href="#paquete" xlink:href="#paquete"><animateMotion dur="12s" begin="-5s" repeatCount="indefinite" rotate="0"><mpath href="#r3" xlink:href="#r3"/></animateMotion></use>
  </g>

  <!-- zona tranquila a la izquierda para el contenido -->
  <rect width="1920" height="1080" fill="url(#calma)"/>
</svg>
